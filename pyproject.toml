[project]
name = "xtb-lab-harness"
version = "0.1.0"
description = "MCP server that exposes xTB computational chemistry operations to LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edmond Ko" }]
dependencies = [
    "mcp>=1.9.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
xtb-lab-harness = "xtb_lab_harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtb_lab_harness"]

[tool.hatch.build.targets.wheel.sources]
"src/xtb_lab_harness" = "xtb_lab_harness"

[tool.hatch.build.targets.sdist]
include = ["src/xtb_lab_harness", "examples", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
